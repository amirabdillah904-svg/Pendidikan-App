name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build signed Release APK & AAB (membutuhkan Secrets keystore)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-android:
    name: Test & Build Dept. Pendidikan Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify bundled PWA assets
        run: |
          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/manifest.json
          test -f app/src/main/assets/www/sw.js
          test -f app/src/main/assets/www/icon-192.png
          test -f app/src/main/assets/www/icon-512.png

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename Debug APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DeptPendidikan-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeptPendidikan-debug-apk
          path: dist/DeptPendidikan-debug.apk
          retention-days: 30

      - name: Check Release Signing Secrets
        id: check_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets belum diatur; melewati build release bertanda tangan."
          fi

      - name: Decode Release Keystore
        if: |
          steps.check_signing.outputs.ready == 'true' &&
          (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_release == 'true')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Build Signed Release APK & AAB
        if: |
          steps.check_signing.outputs.ready == 'true' &&
          (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_release == 'true')
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk dist/DeptPendidikan-release.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/DeptPendidikan-release.aab

      - name: Upload Release Artifacts
        if: |
          steps.check_signing.outputs.ready == 'true' &&
          (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_release == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: DeptPendidikan-release-artifacts
          path: |
            dist/DeptPendidikan-release.apk
            dist/DeptPendidikan-release.aab
          retention-days: 90

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/DeptPendidikan-*.apk
            dist/DeptPendidikan-*.aab
