name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Nama tag release opsional (kosongkan untuk otomatis, mis. v1.0.1)'
        required: false
        default: ''
        type: string
      build_release:
        description: 'Build signed Release APK & AAB (membutuhkan Secrets keystore)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-android:
    name: Test, Build & Release Dept. Pendidikan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_DIR" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
            (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platform-tools" "platforms;android-36.1" || \
              "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platform-tools" || true
          else
            echo "Warning: sdkmanager tidak ditemukan di $SDK_DIR; mengandalkan SDK bawaan runner."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Cache Robolectric SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-sdk36-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-sdk36-

      - name: Verify bundled PWA assets
        run: |
          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/manifest.json
          test -f app/src/main/assets/www/sw.js
          test -f app/src/main/assets/www/icon-192.png
          test -f app/src/main/assets/www/icon-512.png

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-debug-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DeptPendidikan-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeptPendidikan-debug-apk
          path: dist/DeptPendidikan-debug.apk
          retention-days: 30

      - name: Check Release Signing Secrets
        id: check_signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          HAS_KS=$([ -n "${KEYSTORE_BASE64//[[:space:]]/}" ] && echo "SET" || echo "MISSING")
          HAS_SP=$([ -n "${STORE_PASSWORD//[[:space:]]/}" ] && echo "SET" || echo "MISSING")
          HAS_KP=$([ -n "${KEY_PASSWORD//[[:space:]]/}" ] && echo "SET" || echo "MISSING")

          echo "Status Secrets -> KEYSTORE_BASE64: $HAS_KS | STORE_PASSWORD: $HAS_SP | KEY_PASSWORD: $HAS_KP"
          echo "has_ks=$HAS_KS" >> "$GITHUB_OUTPUT"
          echo "has_sp=$HAS_SP" >> "$GITHUB_OUTPUT"
          echo "has_kp=$HAS_KP" >> "$GITHUB_OUTPUT"

          SHOULD_BUILD="false"
          if [ "${{ github.event_name }}" = "push" ]; then
            SHOULD_BUILD="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.build_release }}" != "false" ]; then
            SHOULD_BUILD="true"
          fi

          if [ "$SHOULD_BUILD" = "true" ] && [ "$HAS_KS" = "SET" ] && [ "$HAS_SP" = "SET" ] && [ "$HAS_KP" = "SET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode & Validate Release Keystore
        if: steps.check_signing.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          CLEAN_SP="$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > my-upload-key.jks
          keytool -list -keystore my-upload-key.jks -storepass "$CLEAN_SP" -alias upload > /dev/null
          echo "Keystore alias 'upload' berhasil divalidasi."

      - name: Build Signed Release APK & AAB
        if: steps.check_signing.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          RAW_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export STORE_PASSWORD="$(printf '%s' "$RAW_STORE_PASSWORD" | tr -d '\r\n')"
          export KEY_PASSWORD="$(printf '%s' "$RAW_KEY_PASSWORD" | tr -d '\r\n')"
          gradle :app:assembleRelease :app:bundleRelease --no-configuration-cache --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DeptPendidikan.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/DeptPendidikan.aab
          ls -lh dist/

      - name: Clean up Release Keystore
        if: always()
        run: rm -f my-upload-key.jks

      - name: Upload Release Artifacts
        if: steps.check_signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DeptPendidikan-artifacts
          path: |
            dist/DeptPendidikan.apk
            dist/DeptPendidikan.aab
          retention-days: 90

      - name: Prepare GitHub Release Metadata
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: release_meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=Dept. Pendidikan $TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/DeptPendidikan.apk
            dist/DeptPendidikan.aab
            dist/DeptPendidikan-debug.apk

      - name: Write Build Summary
        if: always()
        shell: bash
        run: |
          echo "### Hasil Build Dept. Pendidikan" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Secrets**: \`KEYSTORE_BASE64=${{ steps.check_signing.outputs.has_ks }}\`, \`STORE_PASSWORD=${{ steps.check_signing.outputs.has_sp }}\`, \`KEY_PASSWORD=${{ steps.check_signing.outputs.has_kp }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Debug APK**: \`DeptPendidikan-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check_signing.outputs.ready }}" = "true" ]; then
            echo "- **Signed APK & AAB**: Berhasil dibuat (\`DeptPendidikan.apk\` & \`DeptPendidikan.aab\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Signed APK & AAB**: Dilewati — pastikan ketiga **Repository Secrets** (\`KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, \`KEY_PASSWORD\`) sudah terisi di **Settings → Secrets and variables → Actions**." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ steps.release_meta.outputs.tag }}" ]; then
            echo "- **GitHub Release**: \`${{ steps.release_meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
